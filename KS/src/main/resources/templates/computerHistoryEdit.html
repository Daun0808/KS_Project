<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>컴퓨터 이력 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-fixed {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: #f8f9fa;
      padding: 5px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .navbar-btn {
      font-size: 1rem;
      margin-right: 15px;
    }

    body {
      padding-top: 60px;
    }
  </style>
</head>
<body>
<div class="navbar-fixed">
  <div class="container d-flex justify-content-start">
    <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
    <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
    <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
    <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
    <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
    <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
    <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
  </div>
</div>
<div class="container mt-5">
  <h3>컴퓨터 이력 수정</h3>
  <form th:action="@{/computer/history/update}" method="post">
    <input type="hidden" name="computerHistoryId" th:value="${history.computerHistoryId}" />
    <input type="hidden" name="historyTag" th:value="${history.historyTag}" />

    <div class="mb-3">
      <label class="form-label">구분</label>
      <input type="text" class="form-control" th:value="${history.historyTag}" disabled />
    </div>

    <div class="mb-3">
      <label for="departmentBeforeName" class="form-label">이전 부서명</label>
      <select id="departmentBeforeName" name="departmentBeforeName" class="form-select">
        <option value="">(없음)</option>
        <option th:each="dept : ${departments}"
                th:value="${dept.departmentName}"
                th:text="${dept.departmentName + ' (' + dept.departmentFloor + '층)'}"
                th:selected="${dept.departmentName == history.departmentBeforeName}">
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label for="departmentNewName" class="form-label">신규 부서명</label>
      <select id="departmentNewName" name="departmentNewName" class="form-select">
        <option th:each="dept : ${departments}"
                th:value="${dept.departmentName}"
                th:text="${dept.departmentName + ' (' + dept.departmentFloor + '층)'}"
                th:selected="${dept.departmentName == history.departmentNewName}">
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label for="placeDate" class="form-label">설치일</label>
      <input type="date" id="placeDate" name="placeDate" th:value="${history.placeDate}" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="historyText" class="form-label">메모</label>
      <textarea id="historyText" name="historyText" class="form-control" rows="3" th:text="${history.historyText}"></textarea>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">수정</button>
      <a th:href="@{/computer/{id}/history(id=${history.computer.computerId})}" class="btn btn-secondary">취소</a>
    </div>
  </form>
</div>
</body>
</html>
