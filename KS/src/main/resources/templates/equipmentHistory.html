<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>의료장비 이력</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-btn {
            font-size: 1rem;
            margin-right: 15px;
        }

        body {
            padding-top: 60px;
        }
    </style>
</head>
<body>
<div class="navbar-fixed">
    <div class="container d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/toner/history/summary" class="btn btn-outline-warning navbar-btn">부서별 사용량 통계</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
        <a href="/equipment" class="btn btn-outline-dark navbar-btn">의료장비 관리</a>
        <a href="/logs" class="btn btn-outline-dark navbar-btn">서버 로그</a>
    </div>
</div>
<div class="container my-5">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title mb-3">장비 기본 정보</h4>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <strong>장비명:</strong>
                    <span th:text="${equipment.equipmentName}"></span>
                </li>
                <li class="list-group-item">
                    <strong>부서명:</strong>
                    <span th:text="${equipment.department.departmentName}"></span>
                </li>
                <li class="list-group-item">
                    <strong>층:</strong>
                    <span th:text="${equipment.department.departmentFloor} + '층'"></span>
                </li>
            </ul>
        </div>
    </div>

    <div class="card shadow-sm mb-4" th:if="${#lists.isEmpty(repairHistory) == false}">
        <div class="card-body">
            <h5 class="card-title">수리 이력</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-primary">
                    <tr>
                        <th>수리 내용</th>
                        <th>수리 날짜</th>
                        <th>메모</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="history : ${repairHistory}">
                        <td th:text="${history.equipmentRepair}">수리내용</td>
                        <td th:text="${#temporals.format(history.equipmentRepairDate, 'yyyy-MM-dd')}">수리날짜</td>
                        <td th:text="${history.equipmentText}">메모</td>
                        <td>
                            <a th:href="@{/equipment/history/edit/{id}(id=${history.equipmentHistoryId})}" class="btn btn-sm btn-outline-primary">수정</a>
                            <a th:href="@{/equipment/history/delete/{id}(id=${history.equipmentHistoryId})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4" th:if="${#lists.isEmpty(changeHistory) == false}">
        <div class="card-body">
            <h5 class="card-title">부서 변경 이력</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-success">
                    <tr>
                        <th>이전 부서명</th>
                        <th>신규 부서명</th>
                        <th>변경일</th>
                        <th>메모</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="history : ${changeHistory}">
                        <td th:text="${history.departmentBeforeName}">이전부서</td>
                        <td th:text="${history.departmentNewName}">신규부서</td>
                        <td th:text="${#temporals.format(history.equipmentAfterDate, 'yyyy-MM-dd')}">변경일</td>
                        <td th:text="${history.equipmentText}">메모</td>
                        <td>
                            <a th:href="@{/equipment/history/edit/{id}(id=${history.equipmentHistoryId})}" class="btn btn-sm btn-outline-primary">수정</a>
                            <a th:href="@{/equipment/history/delete/{id}(id=${history.equipmentHistoryId})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <a th:href="@{/equipment/{equipment_id}/repair(equipment_id=${equipment.equipmentId})}" class="btn btn-outline-primary px-4">
            수리 이력 생성
        </a>
        <a href="/equipment" class="btn btn-outline-secondary px-4">
            의료장비 목록으로 돌아가기
        </a>
    </div>
</div>
</body>
</html>
