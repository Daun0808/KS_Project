<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>의료장비 이력 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-fixed {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: #f8f9fa;
      padding: 5px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .navbar-btn {
      font-size: 1rem;
      margin-right: 15px;
    }

    body {
      padding-top: 60px;
    }
  </style>
</head>
<body>
<div class="navbar-fixed">
  <div class="container d-flex justify-content-start">
    <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
    <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
    <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
    <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
    <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
    <a href="/toner/history/summary" class="btn btn-outline-warning navbar-btn">부서별 사용량 통계</a>
    <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
    <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
    <a href="/equipment" class="btn btn-outline-dark navbar-btn">의료장비 관리</a>
    <a href="/logs" class="btn btn-outline-dark navbar-btn">서버 로그</a>
  </div>
</div>
<div class="container mt-5">
  <h3>의료장비 이력 수정</h3>
  <form th:action="@{/equipment/history/update}" method="post">
    <input type="hidden" id="equipmentHistoryId" name="equipmentHistoryId" th:value="${history.getEquipmentHistoryId()}" />
    <input type="hidden" id="equipmentId" name="equipmentId" th:value="${history.getEquipment().getEquipmentId()}" />
    <input type="hidden" id="historyTag" name="historyTag" th:value="${history.getHistoryTag()}" />
    <input type="hidden" id="del" name="del" th:value="${history.getDel()}" />

    <div th:if="${history.getHistoryTag().equals('수리')}">
      <div class="mb-3">
        <label for="equipmentRepair" class="form-label">수리 내용</label>
        <input type="text" id="equipmentRepair" name="equipmentRepair" th:value="${history.getEquipmentRepair()}" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="equipmentRepairDate" class="form-label">수리 날짜</label>
        <input type="date" id="equipmentRepairDate" name="equipmentRepairDate" th:value="${history.getEquipmentRepairDate()}" class="form-control" />
      </div>
    </div>

    <div th:if="${history.getHistoryTag().equals('부서 변경')}">
      <div class="mb-3">
        <label for="departmentBeforeName" class="form-label">이전 부서명</label>
        <input type="text" id="departmentBeforeName" name="departmentBeforeName" th:value="${history.getDepartmentBeforeName()}" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="departmentNewName" class="form-label">신규 부서명</label>
        <input type="text" id="departmentNewName" name="departmentNewName" th:value="${history.getDepartmentNewName()}" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="equipmentAfterDate" class="form-label">변경 날짜</label>
        <input type="date" id="equipmentAfterDate" name="equipmentAfterDate" th:value="${history.getEquipmentAfterDate()}" class="form-control" />
      </div>
    </div>

    <div class="mb-3">
      <label for="equipmentText" class="form-label">메모</label>
      <textarea id="equipmentText" name="equipmentText" class="form-control" rows="3" th:value="${history.getEquipmentText()}"></textarea>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">수정</button>
      <a th:href="@{/equipment/{id}/history(id=${history.getEquipment().getEquipmentId()})}" class="btn btn-secondary">취소</a>
    </div>
  </form>
</div>
</body>
</html>
