<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>토너 입출고 목록</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <style>
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .navbar-btn {
            font-size: 1rem;
            margin-right: 15px;
        }
        body {
            padding-top: 60px;
        }
    </style>

    <script>
        // 테이블 필터 함수
        function showSummary() {
            let departmentInput = document
                .getElementById("departmentSearch")
                .value.toLowerCase();

            let startDateStr = document.getElementById("startDate").value;
            let endDateStr = document.getElementById("endDate").value;

            let rows = document.querySelectorAll("tbody tr");

            let startDate = startDateStr ? new Date(startDateStr) : null;
            let endDate = endDateStr ? new Date(endDateStr) : null;

            let summaryMap = {};

            rows.forEach((row) => {

                // 이미 summary-row면 스킵
                if (row.classList.contains("summary-row")) return;

                const dateText = row.children[0].innerText;
                const department = row.children[1].innerText;
                const tonerName = row.children[2].innerText;
                const delivery = parseInt(row.children[3].innerText) || 0;

                let rowDate = new Date(dateText);

                const matchDepartment = department
                    .toLowerCase()
                    .includes(departmentInput);

                let matchDate = true;
                if (startDate && rowDate < startDate) matchDate = false;
                if (endDate && rowDate > endDate) matchDate = false;

                const isMatch = matchDepartment && matchDate;

                // 🔥 원본 행 전부 숨김
                row.style.display = "none";

                if (isMatch) {
                    const key = department + "||" + tonerName;

                    if (!summaryMap[key]) {
                        summaryMap[key] = 0;
                    }

                    summaryMap[key] += delivery;
                }
            });

            // 기존 합계행 제거
            document.querySelectorAll(".summary-row").forEach(row => row.remove());

            const tbody = document.querySelector("tbody");

            // 🔥 합계행 생성
            for (let key in summaryMap) {
                const [department, tonerName] = key.split("||");
                const total = summaryMap[key];

                let tr = document.createElement("tr");
                tr.classList.add("summary-row");
                tr.style.backgroundColor = "#d9edf7";

                tr.innerHTML = `
            <td></td>
            <td><strong>${department}</strong></td>
            <td><strong>${tonerName}</strong></td>
            <td><strong>${total}</strong></td>
        `;

                tbody.appendChild(tr);
            }
        }


        function resetTable() {
            // 🔥 합계행 제거
            document.querySelectorAll(".summary-row").forEach(row => row.remove());

            // 🔥 원본 행 다시 보이기
            document.querySelectorAll("tbody tr")


            // 페이지 로드 시 시작일과 종료일 기본값 세팅 (오늘, 한 달 전)
            window.onload = function () {
                const startDateInput = document.getElementById("startDate");
                const endDateInput = document.getElementById("endDate");

                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, "0");
                const dd = String(today.getDate()).padStart(2, "0");

                const endDateStr = `${yyyy}-${mm}-${dd}`;
                endDateInput.value = endDateStr;

                const oneMonthAgo = new Date(today);
                oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);

                const yyyyStart = oneMonthAgo.getFullYear();
                const mmStart = String(oneMonthAgo.getMonth() + 1).padStart(2, "0");
                const ddStart = String(oneMonthAgo.getDate()).padStart(2, "0");

                const startDateStr = `${yyyyStart}-${mmStart}-${ddStart}`;
                startDateInput.value = startDateStr;

                filterTable(); // 초기 필터 적용
            }
        };
    </script>
</head>
<body>
<div class="navbar-fixed">
    <div class="container d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
        <a href="/logs" class="btn btn-outline-dark navbar-btn">서버 로그</a>
    </div>
</div>

<div class="container mt-5">
    <h2 class="text-center mb-4">토너 입출고 목록</h2>

    <!-- 검색 영역 -->
    <div class="row mb-3">
        <div class="col-md-3">
            <label for="startDate" class="form-label">시작일</label>
            <input
                    type="date"
                    id="startDate"
                    class="form-control"
                    onchange="filterTable()"
            />
        </div>
        <div class="col-md-3">
            <label for="endDate" class="form-label">종료일</label>
            <input
                    type="date"
                    id="endDate"
                    class="form-control"
                    onchange="filterTable()"
            />
        </div>
        <div class="col-md-3">
            <label for="departmentSearch" class="form-label">부서명</label>
            <input
                    type="text"
                    id="departmentSearch"
                    class="form-control"
                    placeholder="부서명 검색"
                    onkeyup="filterTable()"
            />
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary me-2" onclick="showSummary()">검색</button>
            <button class="btn btn-secondary" onclick="resetTable()">초기화</button>
        </div>

    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>날짜</th>
            <th>부서명</th>
            <th>토너 이름</th>
            <th>출고 수량</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="history : ${tonerHistoryList}">
            <td th:text="${history.historyDate()}"></td>
            <td th:text="${history.departmentName()}"></td>
            <td th:text="${history.tonerName()}"></td>
            <td th:text="${history.historyDelivery()}"></td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3 text-center">
        <a href="/toner/month" class="btn btn-secondary">토너 목록으로 돌아가기</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
