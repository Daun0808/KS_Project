<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>토너 일괄 입고 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <style>
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-btn {
            font-size: 1rem;
            margin-right: 15px;
        }

        body {
            padding-top: 60px;
        }

        td, th {
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="navbar-fixed">
    <div class="container d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
    </div>
</div>

<div class="container mt-5">
    <h2 class="text-center mb-4">토너 일괄 입고 등록</h2>
    <p class="text-muted text-center">한 번에 여러 종류의 토너가 입고됐을 때, 수량만 입력하고 한 번에 등록하세요. 수량이 0인 항목은 등록되지 않습니다.</p>

    <form th:action="@{/toner/history/bulk-create}" method="post">

        <div class="row mb-4">
            <div class="col-md-4">
                <label for="historyDate" class="form-label">입고 날짜</label>
                <input type="date" id="historyDate" name="historyDate" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label for="departmentName" class="form-label">입고 부서</label>
                <select id="departmentName" name="departmentName" class="form-select" required>
                    <option value="">부서를 선택하세요</option>
                    <option th:each="department : ${departmentList}"
                            th:value="${department.getDepartmentName()}"
                            th:text="${department.getDepartmentName() + ' (' + department.getDepartmentFloor() + '층)'}">
                    </option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="historyText" class="form-label">공통 비고 (선택)</label>
                <input type="text" id="historyText" name="historyText" class="form-control" maxlength="50" placeholder="예: 정기 입고">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                <tr>
                    <th style="width:5%">번호</th>
                    <th>제품 코드</th>
                    <th>제품명</th>
                    <th>단위</th>
                    <th style="width:15%">현재 재고</th>
                    <th style="width:20%">입고 수량</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="toner, iterStat : ${tonerList}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td th:text="${toner.getTonerCode()}">코드</td>
                    <td th:text="${toner.getTonerName()}">제품명</td>
                    <td th:text="${toner.getTonerUnit()}">단위</td>
                    <td th:text="${toner.getTonerQuantity()}">재고</td>
                    <td>
                        <input type="number" class="form-control"
                               th:name="'qty_' + ${toner.getTonerId()}"
                               min="0" th:value="0">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <button type="submit" class="btn btn-primary w-100">일괄 등록</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/toner/month" class="btn btn-secondary">월별 토너 재고로 돌아가기</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function () {
        $('#departmentName').select2({
            placeholder: "부서를 선택하세요",
            allowClear: true
        });
    });
</script>
</body>
</html>
