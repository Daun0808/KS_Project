<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>토너 일괄 입고 결과</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-btn {
            font-size: 1rem;
            margin-right: 15px;
        }

        body {
            padding-top: 60px;
        }
    </style>
</head>
<body>
<div class="navbar-fixed">
    <div class="container d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
    </div>
</div>

<div class="container mt-5">
    <h2 class="text-center mb-4">토너 일괄 입고 결과</h2>

    <div class="card shadow-sm mb-4" th:if="${#lists.isEmpty(successList) == false}">
        <div class="card-body">
            <h5 class="card-title text-success">등록 성공 (<span th:text="${#lists.size(successList)}"></span>건)</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" th:each="msg : ${successList}" th:text="${msg}"></li>
            </ul>
        </div>
    </div>

    <div class="card shadow-sm mb-4" th:if="${#lists.isEmpty(failList) == false}">
        <div class="card-body">
            <h5 class="card-title text-danger">등록 실패 (<span th:text="${#lists.size(failList)}"></span>건)</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" th:each="msg : ${failList}" th:text="${msg}"></li>
            </ul>
        </div>
    </div>

    <div class="alert alert-secondary text-center" th:if="${#lists.isEmpty(successList) and #lists.isEmpty(failList)}">
        입력한 항목이 없습니다. 수량을 1 이상 입력한 토너가 없었습니다.
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="/toner/history/bulk-create" class="btn btn-outline-primary px-4">계속 등록하기</a>
        <a href="/toner/month" class="btn btn-outline-secondary px-4">월별 토너 재고로 돌아가기</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
