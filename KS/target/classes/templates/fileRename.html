<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파일 일괄 이름변환 + ZIP 다운로드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<h2>파일 이름 변환</h2>
<input type="file" id="fileInput" multiple />
<br><br>
<button onclick="processFiles()">파일 이름 변경</button>

<script>
    function moveLast3ToFrontWithUnderscore(fileName) {
        const dotIndex = fileName.lastIndexOf(".");
        if (dotIndex === -1) return null;

        const name = fileName.substring(0, dotIndex);
        const ext = fileName.substring(dotIndex);

        // 차트번호_날짜_컬러_방향_이름_숫자 -> 이름_차트번호_날짜_컬러_방향 (숫자는 버림)
        const parts = name.split("_");
        if (parts.length < 2) return null;

        const nameField = parts[parts.length - 2]; // 이름 (맨 앞으로 이동)
        const rest = parts.slice(0, parts.length - 2); // 차트번호_날짜_컬러_방향 (숫자는 제외)

        return `${[nameField, ...rest].join("_")}${ext}`;
    }

    async function processFiles() {
        const input = document.getElementById('fileInput');
        const files = input.files;

        if (!files.length) {
            alert('파일을 선택해주세요.');
            return;
        }

        const zip = new JSZip();

        for (let file of files) {
            const newFileName = moveLast3ToFrontWithUnderscore(file.name);
            if (!newFileName) continue;

            const arrayBuffer = await file.arrayBuffer();
            zip.file(newFileName, arrayBuffer);
        }

        // ZIP 생성 후 다운로드
        zip.generateAsync({ type: "blob" }).then(function (content) {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = "변환된_파일.zip";
            link.click();
            URL.revokeObjectURL(link.href);
        });
    }
</script>
</body>
</html>
