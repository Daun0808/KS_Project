<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파일 일괄 이름변환 + ZIP 다운로드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<h2>파일 이름 변환</h2>
<p>차트번호_날짜_컬러_방향_이름_숫자 형식의 파일명을 변환합니다.</p>
<input type="file" id="fileInput" multiple />
<br><br>
<button onclick="processFiles('name')">이름순으로 변경</button>
<button onclick="processFiles('number')">숫자순으로 변경</button>

<script>
    // 이름순: 이름을 맨 앞으로, 숫자는 버림 -> 이름_차트번호_날짜_컬러_방향
    function moveNameToFront(fileName) {
        const dotIndex = fileName.lastIndexOf(".");
        if (dotIndex === -1) return null;

        const name = fileName.substring(0, dotIndex);
        const ext = fileName.substring(dotIndex);

        const parts = name.split("_");
        if (parts.length < 2) return null;

        const nameField = parts[parts.length - 2]; // 이름 (맨 앞으로 이동)
        const rest = parts.slice(0, parts.length - 2); // 차트번호_날짜_컬러_방향 (숫자는 제외)

        return `${[nameField, ...rest].join("_")}${ext}`;
    }

    // 숫자순: 숫자를 맨 앞으로, 이름은 버림 -> 숫자_차트번호_날짜_컬러_방향
    function moveNumberToFront(fileName) {
        const dotIndex = fileName.lastIndexOf(".");
        if (dotIndex === -1) return null;

        const name = fileName.substring(0, dotIndex);
        const ext = fileName.substring(dotIndex);

        const parts = name.split("_");
        if (parts.length < 2) return null;

        const numberField = parts[parts.length - 1]; // 숫자 (맨 앞으로 이동)
        const rest = parts.slice(0, parts.length - 2); // 차트번호_날짜_컬러_방향 (이름은 제외)

        return `${[numberField, ...rest].join("_")}${ext}`;
    }

    async function processFiles(mode) {
        const input = document.getElementById('fileInput');
        const files = input.files;

        if (!files.length) {
            alert('파일을 선택해주세요.');
            return;
        }

        const convert = mode === 'number' ? moveNumberToFront : moveNameToFront;
        const zip = new JSZip();

        for (let file of files) {
            const newFileName = convert(file.name);
            if (!newFileName) continue;

            const arrayBuffer = await file.arrayBuffer();
            zip.file(newFileName, arrayBuffer);
        }

        // ZIP 생성 후 다운로드
        zip.generateAsync({ type: "blob" }).then(function (content) {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = (mode === 'number' ? "숫자순_변환.zip" : "이름순_변환.zip");
            link.click();
            URL.revokeObjectURL(link.href);
        });
    }
</script>
</body>
</html>
