<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>서버 로그</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-btn {
            font-size: 1rem;
            margin-right: 15px;
        }

        body {
            padding-top: 60px;
            background-color: #f4f4f4;
        }

        #logBox {
            background-color: #111;
            color: #ddd;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 1rem;
            border-radius: 6px;
            height: 72vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-error { color: #ff6b6b; }
        .log-warn { color: #ffd166; }
    </style>
</head>
<body>
<div class="navbar-fixed">
    <div class="container-fluid d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/toner/history/summary" class="btn btn-outline-warning navbar-btn">부서별 사용량 통계</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
        <a href="/logs" class="btn btn-outline-dark navbar-btn">서버 로그</a>
    </div>
</div>

<div class="container-fluid mt-4" style="max-width: 1400px;">
    <h2 class="text-center mb-4">서버 로그</h2>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <div class="d-flex flex-wrap align-items-center gap-2">
            <input type="text" id="filterInput" class="form-control" placeholder="필터 (예: ERROR, computer_id)" style="width: 240px" />
            <select id="linesSelect" class="form-select" style="width: 120px">
                <option value="200">200줄</option>
                <option value="300" selected>300줄</option>
                <option value="500">500줄</option>
                <option value="1000">1000줄</option>
            </select>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="form-check mb-0">
                <input type="checkbox" id="autoRefresh" class="form-check-input" checked />
                <label for="autoRefresh" class="form-check-label">자동 새로고침 (2초)</label>
            </div>
            <div class="form-check mb-0">
                <input type="checkbox" id="autoScroll" class="form-check-input" checked />
                <label for="autoScroll" class="form-check-label">자동 스크롤</label>
            </div>
            <button type="button" class="btn btn-sm btn-outline-dark" onclick="fetchLogs()">지금 새로고침</button>
        </div>
    </div>

    <div id="logBox">불러오는 중...</div>
</div>

<script>
    let lastRawText = '';
    let timer = null;

    async function fetchLogs() {
        const lines = document.getElementById('linesSelect').value;
        try {
            const res = await fetch('/logs/tail?lines=' + lines);
            lastRawText = await res.text();
            render();
        } catch (e) {
            // 일시적인 네트워크 오류는 무시하고 다음 주기에 재시도
        }
    }

    function render() {
        const filter = document.getElementById('filterInput').value.trim().toLowerCase();
        const box = document.getElementById('logBox');
        const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 10;

        let lines = lastRawText.split('\n');
        if (filter) {
            lines = lines.filter(l => l.toLowerCase().includes(filter));
        }

        box.innerHTML = lines.map(colorize).join('\n');

        if (document.getElementById('autoScroll').checked && wasAtBottom) {
            box.scrollTop = box.scrollHeight;
        }
    }

    function colorize(line) {
        const escaped = line
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        if (/ERROR/.test(line)) return '<span class="log-error">' + escaped + '</span>';
        if (/WARN/.test(line)) return '<span class="log-warn">' + escaped + '</span>';
        return escaped;
    }

    function scheduleTimer() {
        if (timer) clearInterval(timer);
        if (document.getElementById('autoRefresh').checked) {
            timer = setInterval(fetchLogs, 2000);
        }
    }

    document.getElementById('autoRefresh').addEventListener('change', scheduleTimer);
    document.getElementById('linesSelect').addEventListener('change', fetchLogs);
    document.getElementById('filterInput').addEventListener('input', render);

    fetchLogs();
    scheduleTimer();
</script>
</body>
</html>
