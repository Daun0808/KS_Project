<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>부서별 토너 사용량</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <style>
        :root {
            --text-secondary: #52514e;
            --text-muted: #898781;
            --gridline: #e9e8e3;
        }
        .navbar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 5px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .navbar-btn { font-size: 1rem; margin-right: 15px; }
        body { padding-top: 60px; background-color: #f9f9f7; }

        .usage-card {
            background: #fff;
            border: 1px solid rgba(11,11,11,0.08);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 1px 2px rgba(11,11,11,0.04);
        }
        .usage-body {
            display: flex; align-items: center; gap: 36px; flex-wrap: wrap;
        }
        .donut-wrap {
            position: relative; width: 220px; height: 220px; flex: 0 0 220px; margin: 0 auto;
        }
        .donut-wrap svg { width: 100%; height: 100%; overflow: visible; }
        .seg { cursor: pointer; transition: opacity .15s ease; }
        .seg:hover, .seg:focus-visible { opacity: .85; }
        .seg[data-dim="1"] { opacity: .28; }
        .donut-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: none; text-align: center;
        }
        .donut-center-value { font-size: 28px; font-weight: 700; line-height: 1; }
        .donut-center-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.4; }

        .usage-legend { flex: 1 1 260px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
        .usage-legend li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
        .usage-legend li:hover, .usage-legend li:focus-visible { background: var(--gridline); }
        .swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }
        .legend-name { font-size: 14px; font-weight: 600; flex: 1 1 auto; }
        .legend-nums { font-size: 13px; color: var(--text-secondary); display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
        .legend-pct { color: var(--text-muted); min-width: 42px; text-align: right; }

        .usage-tooltip {
            position: fixed; pointer-events: none; background: #0b0b0b; color: #fff;
            font-size: 12px; font-weight: 600; padding: 7px 10px; border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.18); transform: translate(-50%, -130%);
            white-space: nowrap; opacity: 0; transition: opacity .1s ease; z-index: 1050;
        }
        .usage-tooltip.on { opacity: 1; }

        .refresh-status { font-size: 13px; color: var(--text-muted); }
        .refresh-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #1baf7a; margin-right: 6px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

        .empty-state { text-align: center; padding: 40px 16px; color: var(--text-secondary); }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div class="navbar-fixed">
    <div class="container d-flex justify-content-start">
        <a href="/" class="btn btn-outline-primary navbar-btn">홈</a>
        <a href="/department" class="btn btn-outline-success navbar-btn">부서 관리</a>
        <a href="/printer" class="btn btn-outline-danger navbar-btn">프린터 관리</a>
        <a href="/toner" class="btn btn-outline-warning navbar-btn">토너 관리</a>
        <a href="/toner/month" class="btn btn-outline-warning navbar-btn">월별 토너 재고</a>
        <a href="/toner/history/summary" class="btn btn-warning navbar-btn">부서별 사용량 통계</a>
        <a href="/computer" class="btn btn-outline-info navbar-btn">컴퓨터 관리</a>
        <a href="/monitor" class="btn btn-outline-secondary navbar-btn">모니터 관리</a>
        <a href="/logs" class="btn btn-outline-dark navbar-btn">서버 로그</a>
    </div>
</div>

<div class="container mt-4" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-end flex-wrap mb-3">
        <div>
            <h2 class="mb-1">부서별 토너 사용량</h2>
            <div class="refresh-status">
                <span class="refresh-dot"></span>30초마다 자동 갱신 · 마지막 갱신 <span id="lastUpdated">-</span>
            </div>
        </div>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/toner/history/summary}">
        <div class="col-auto">
            <label class="form-label mb-0">시작일</label>
            <input type="date" name="start" class="form-control" th:value="${start}" />
        </div>
        <div class="col-auto">
            <label class="form-label mb-0">종료일</label>
            <input type="date" name="end" class="form-control" th:value="${end}" />
        </div>
        <div class="col-auto d-flex align-items-end">
            <button type="submit" class="btn btn-primary">조회</button>
        </div>
        <div class="col-auto d-flex align-items-end">
            <button type="button" class="btn btn-outline-secondary" id="viewToggle">표로 보기</button>
        </div>
    </form>

    <div class="usage-card">
        <div class="usage-body" id="chartView">
            <div class="donut-wrap">
                <svg id="donutSvg" viewBox="0 0 220 220" role="img" aria-label="부서별 토너 사용량 원형 그래프"></svg>
                <div class="donut-center">
                    <div class="donut-center-value" id="centerValue">0개</div>
                    <div class="donut-center-label">선택 기간<br>총 출고량</div>
                </div>
            </div>
            <ul class="usage-legend" id="legendList"></ul>
        </div>
        <div class="empty-state" id="emptyState" hidden>선택한 기간에 출고 기록이 없습니다.</div>

        <div id="tableView" hidden>
            <table class="table table-sm table-striped mb-0">
                <caption class="px-2">부서별 토너 출고 합계 (개), 전체 대비 비중</caption>
                <thead>
                <tr><th>부서</th><th class="text-end">출고량</th><th class="text-end">비중</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 서버가 처음 렌더링한 값 (JS가 이 테이블을 읽어서 최초 차트를 그린다) -->
    <table id="initialData" hidden>
        <tbody>
        <tr th:each="row : ${summary}">
            <td th:text="${row.departmentName()}"></td>
            <td th:text="${row.totalDelivery()}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div class="usage-tooltip" id="tooltip" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var dataUrl = "/toner/history/summary/data";
    var startParam = document.querySelector('input[name="start"]').value;
    var endParam = document.querySelector('input[name="end"]').value;

    var svg = document.getElementById("donutSvg");
    var legendList = document.getElementById("legendList");
    var tableBody = document.getElementById("tableBody");
    var tooltip = document.getElementById("tooltip");
    var centerValue = document.getElementById("centerValue");
    var chartView = document.getElementById("chartView");
    var emptyState = document.getElementById("emptyState");
    var lastUpdated = document.getElementById("lastUpdated");
    var tableView = document.getElementById("tableView");
    var toggle = document.getElementById("viewToggle");

    var svgNS = "http://www.w3.org/2000/svg";
    var cx = 110, cy = 110, r = 88, strokeWidth = 32;
    var circumference = 2 * Math.PI * r;
    var gapPx = 3;

    function readInitialData() {
        var rows = document.querySelectorAll("#initialData tbody tr");
        var out = [];
        rows.forEach(function (tr) {
            var cells = tr.querySelectorAll("td");
            out.push({ departmentName: cells[0].textContent, totalDelivery: parseInt(cells[1].textContent, 10) || 0 });
        });
        return out;
    }

    // "기타"로 접지 않고 부서를 전부 보여준다. 개수가 많아도 각자 구분되는 색을 쓰도록
    // 색상환을 부서 수만큼 균등하게 나눠서 배정한다(고정 8색 팔레트로는 부족하므로).
    function assignColors(raw) {
        var n = raw.length;
        return raw.map(function (d, i) {
            var hue = Math.round((360 / n) * i + 210) % 360; // 210도(파랑)에서 시작해 한 바퀴를 균등 분배
            return { name: d.departmentName, value: d.totalDelivery, color: "hsl(" + hue + ", 62%, 46%)" };
        });
    }

    var hasData = false;

    function render(raw) {
        var data = assignColors(raw);
        var total = data.reduce(function (s, d) { return s + d.value; }, 0);

        svg.innerHTML = "";
        legendList.innerHTML = "";
        tableBody.innerHTML = "";
        centerValue.textContent = total.toLocaleString("ko-KR") + "개";

        hasData = total > 0;
        emptyState.hidden = hasData;
        if (!hasData) {
            chartView.hidden = true;
            return;
        }
        chartView.hidden = !tableView.hidden;

        var group = document.createElementNS(svgNS, "g");
        group.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
        svg.appendChild(group);

        var offset = 0;
        var sorted = data.slice().sort(function (a, b) { return b.value - a.value; });
        var directLabelNames = sorted.slice(0, 2).map(function (d) { return d.name; });
        var cum = 0;

        data.forEach(function (d, i) {
            var frac = total > 0 ? d.value / total : 0;
            var rawLen = frac * circumference;
            var dashLen = Math.max(rawLen - gapPx, 0);

            var circle = document.createElementNS(svgNS, "circle");
            circle.setAttribute("cx", cx);
            circle.setAttribute("cy", cy);
            circle.setAttribute("r", r);
            circle.setAttribute("fill", "none");
            circle.setAttribute("stroke", d.color);
            circle.setAttribute("stroke-width", strokeWidth);
            circle.setAttribute("stroke-dasharray", dashLen + " " + (circumference - dashLen));
            circle.setAttribute("stroke-dashoffset", -offset);
            circle.setAttribute("class", "seg");
            circle.setAttribute("tabindex", "0");
            circle.setAttribute("data-idx", i);
            circle.setAttribute("role", "button");
            var pct = Math.round((d.value / total) * 1000) / 10;
            circle.setAttribute("aria-label", d.name + " " + d.value + "개, 전체의 " + pct + "%");
            group.appendChild(circle);
            offset += rawLen;

            var midFrac = cum + frac / 2;
            cum += frac;
            if (directLabelNames.indexOf(d.name) !== -1) {
                var angle = midFrac * Math.PI * 2 - Math.PI / 2;
                var labelR = r + strokeWidth / 2 + 16;
                var lx = cx + Math.cos(angle) * labelR;
                var ly = cy + Math.sin(angle) * labelR;
                var text = document.createElementNS(svgNS, "text");
                text.setAttribute("x", lx);
                text.setAttribute("y", ly);
                text.setAttribute("text-anchor", lx < cx - 4 ? "end" : (Math.abs(lx - cx) <= 4 ? "middle" : "start"));
                text.setAttribute("dominant-baseline", "middle");
                text.setAttribute("font-size", "12");
                text.setAttribute("font-weight", "700");
                text.setAttribute("fill", "#0b0b0b");
                text.textContent = pct + "%";
                svg.appendChild(text);
            }
        });

        function showTooltip(d, x, y) {
            var pct = Math.round((d.value / total) * 1000) / 10;
            tooltip.innerHTML = "<b>" + d.name + "</b> · " + d.value.toLocaleString("ko-KR") + "개 (" + pct + "%)";
            tooltip.style.left = x + "px";
            tooltip.style.top = y + "px";
            tooltip.classList.add("on");
        }
        function hideTooltip() { tooltip.classList.remove("on"); }
        function highlight(idx) {
            group.querySelectorAll(".seg").forEach(function (s) {
                s.setAttribute("data-dim", idx === null || Number(s.getAttribute("data-idx")) === idx ? "0" : "1");
            });
            legendList.querySelectorAll("li").forEach(function (row) {
                row.style.background = (idx !== null && Number(row.getAttribute("data-idx")) === idx) ? "var(--gridline)" : "";
            });
        }

        group.querySelectorAll(".seg").forEach(function (seg) {
            var idx = Number(seg.getAttribute("data-idx"));
            var d = data[idx];
            seg.addEventListener("mouseenter", function (e) { highlight(idx); showTooltip(d, e.clientX, e.clientY); });
            seg.addEventListener("mousemove", function (e) { showTooltip(d, e.clientX, e.clientY); });
            seg.addEventListener("mouseleave", function () { highlight(null); hideTooltip(); });
            seg.addEventListener("focus", function () {
                var box = seg.getBoundingClientRect();
                highlight(idx);
                showTooltip(d, box.left + box.width / 2, box.top + box.height / 2);
            });
            seg.addEventListener("blur", function () { highlight(null); hideTooltip(); });
        });

        data.forEach(function (d, i) {
            var pct = Math.round((d.value / total) * 1000) / 10;
            var li = document.createElement("li");
            li.setAttribute("data-idx", i);
            li.setAttribute("tabindex", "0");
            li.innerHTML =
                '<span class="swatch" style="background:' + d.color + '"></span>' +
                '<span class="legend-name"></span>' +
                '<span class="legend-nums"><span class="legend-count"></span><span class="legend-pct">' + pct + '%</span></span>';
            li.querySelector(".legend-name").textContent = d.name;
            li.querySelector(".legend-count").textContent = d.value.toLocaleString("ko-KR") + "개";
            li.addEventListener("mouseenter", function () { highlight(i); });
            li.addEventListener("mouseleave", function () { highlight(null); });
            li.addEventListener("focus", function () { highlight(i); });
            li.addEventListener("blur", function () { highlight(null); });
            legendList.appendChild(li);
        });

        // 표는 도넛과 달리 슬롯 제한이 없으니 "기타"로 접지 않고 부서를 전부 나열한다
        // (도넛에서 기타로 뭉친 항목이 정확히 뭔지 확인할 수 있는 유일한 수단).
        raw.forEach(function (d) {
            var pct = total > 0 ? Math.round((d.totalDelivery / total) * 1000) / 10 : 0;
            var tr = document.createElement("tr");
            var tdName = document.createElement("td");
            tdName.textContent = d.departmentName;
            var tdVal = document.createElement("td");
            tdVal.className = "text-end";
            tdVal.textContent = d.totalDelivery.toLocaleString("ko-KR") + "개";
            var tdPct = document.createElement("td");
            tdPct.className = "text-end";
            tdPct.textContent = pct + "%";
            tr.appendChild(tdName); tr.appendChild(tdVal); tr.appendChild(tdPct);
            tableBody.appendChild(tr);
        });
    }

    function refreshFromServer() {
        var url = dataUrl + "?start=" + encodeURIComponent(startParam) + "&end=" + encodeURIComponent(endParam);
        fetch(url, { headers: { "Accept": "application/json" } })
            .then(function (res) { if (!res.ok) throw new Error("bad status"); return res.json(); })
            .then(function (json) {
                render(json);
                lastUpdated.textContent = new Date().toLocaleTimeString("ko-KR");
            })
            .catch(function () { /* 다음 주기에 다시 시도 */ });
    }

    render(readInitialData());
    lastUpdated.textContent = new Date().toLocaleTimeString("ko-KR");
    setInterval(refreshFromServer, 30000);

    toggle.addEventListener("click", function () {
        var showingTable = !tableView.hidden;
        tableView.hidden = showingTable;
        chartView.hidden = showingTable ? !hasData : true;
        toggle.textContent = showingTable ? "표로 보기" : "차트로 보기";
    });
})();
</script>
</body>
</html>
